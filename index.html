<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegants Manager - Sistema Completo</title>
    <style>
        :root { --primary: #f39c12; --secondary: #2c3e50; --bg: #f0f2f5; --success: #27ae60; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding-bottom: 60px; }
        
        /* PANTALLA DE LOGIN */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--secondary); color: white; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px; box-sizing: border-box; text-align: center;
        }
        #login-screen input {
            width: 80%; max-width: 250px; padding: 15px; font-size: 24px;
            text-align: center; border-radius: 8px; border: none; margin-bottom: 20px; color: #333;
        }
        #login-screen button {
            padding: 15px 40px; background: var(--primary);
            border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 18px;
        }

        /* CONTENIDO PRINCIPAL */
        #manager-content { display: none; }

        /* NAVEGACIÓN */
        .tabs { display: flex; background: var(--secondary); position: sticky; top: 0; z-index: 100; }
        .tab-btn { flex: 1; padding: 15px; color: white; border: none; background: none; font-weight: bold; font-size: 11px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { border-bottom: 4px solid var(--primary); background: rgba(255,255,255,0.1); }

        /* SECCIONES */
        .content { padding: 15px; display: none; }
        .content.active { display: block; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { color: var(--secondary); font-size: 1.2em; margin-top: 0; border-left: 4px solid var(--primary); padding-left: 10px; margin-bottom: 15px; }

        /* FORMULARIOS */
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 13px; color: #555; }
        input, textarea, select, .btn-main { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .btn-main { background: var(--primary); color: white; border: none; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .btn-main:disabled { background: #ccc; }

        /* LISTAS */
        .item-lista { border-bottom: 1px solid #eee; padding: 12px 0; font-size: 14px; }
        .item-lista:last-child { border: none; }
        .badge { padding: 3px 7px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .pendiente { background: #ffeaa7; color: #d35400; }
        .en-curso { background: #81ecec; color: #008080; }
        .entregado { background: #55efc4; color: #006266; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Elegants Manager</h1>
        <p>Introduce tu PIN de acceso:</p>
        <input type="password" id="pin-input" placeholder="****" inputmode="numeric">
        <button onclick="verificarAcceso()">ENTRAR</button>
    </div>

    <div id="manager-content">
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'tab-inventario')">INVENTARIO</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-pedidos')">PEDIDOS</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-clientes')">CLIENTES</button>
        </div>

        <div id="tab-inventario" class="content active">
            <div class="card">
                <h2>Agregar Perfume</h2>
                <form id="form-perfume">
                    <input type="text" id="p-nombre" placeholder="Nombre del perfume" required>
                    <input type="number" id="p-precio" placeholder="Precio (CRC)" required>
                    <textarea id="p-desc" placeholder="Descripción (Notas, aroma...)"></textarea>
                    <input type="text" id="p-video" placeholder="Link Video (YouTube/TikTok)">
                    
                    <label>Imagen del producto:</label>
                    <input type="file" id="p-file" accept="image/*" required>

                    <label>Categoría:</label>
                    <select id="p-cat">
                        <option value="Caballero">Caballero</option>
                        <option value="Dama">Dama</option>
                        <option value="Unisex">Unisex</option>
                    </select>

                    <label>Estilo:</label>
                    <select id="p-subcat">
                        <option value="Árabe">Árabe</option>
                        <option value="Sport">Sport</option>
                        <option value="Elegante">Elegante</option>
                        <option value="Nicho">Nicho</option>
                    </select>

                    <button type="submit" id="btn-p" class="btn-main">Guardar en Catálogo</button>
                </form>
            </div>
        </div>

        <div id="tab-pedidos" class="content">
            <div class="card">
                <h2>Pedidos y Entregas</h2>
                <div id="lista-pedidos">Cargando pedidos...</div>
            </div>
        </div>

        <div id="tab-clientes" class="content">
            <div class="card">
                <h2>Registrar Abono</h2>
                <input type="tel" id="a-tel" placeholder="Teléfono del cliente">
                <input type="number" id="a-monto" placeholder="Monto del abono (₡)">
                <button onclick="registrarAbono()" class="btn-main" style="background: var(--success);">Guardar Abono</button>
            </div>
            <div class="card">
                <h2>Base de Datos de Clientes</h2>
                <div id="lista-clientes">Cargando clientes...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjFHWA9gA-yNVlFi-sXCl8anbMJhPrTGs",
            authDomain: "elegants-40696.firebaseapp.com",
            projectId: "elegants-40696",
            storageBucket: "elegants-40696.firebasestorage.app",
            messagingSenderId: "262268889124",
            appId: "1:262268889124:web:15b81eee4052d6c73f90b1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // LOGIN
        window.verificarAcceso = () => {
            const pin = document.getElementById("pin-input").value;
            if(pin === "2652") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("manager-content").style.display = "block";
            } else {
                alert("PIN incorrecto");
            }
        };

        // PESTAÑAS
        window.openTab = (evt, name) => {
            document.querySelectorAll(".content").forEach(c => c.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.getElementById(name).classList.add("active");
            evt.currentTarget.classList.add("active");
            if(name === 'tab-pedidos') cargarPedidos();
            if(name === 'tab-clientes') cargarClientes();
        };

        // GUARDAR PERFUME CON PROGRESO
        document.getElementById("form-perfume").onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btn-p");
            const file = document.getElementById("p-file").files[0];
            const cleanName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
            const storageRef = ref(storage, `perfumes/${Date.now()}_${cleanName}`);
            
            const uploadTask = uploadBytesResumable(storageRef, file);

            uploadTask.on('state_changed', 
                (snap) => {
                    const prog = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
                    btn.innerText = "Subiendo: " + prog + "%";
                    btn.disabled = true;
                }, 
                (err) => { alert("Error al subir: " + err.code); btn.innerText = "Guardar"; btn.disabled = false; }, 
                async () => {
                    const url = await getDownloadURL(uploadTask.snapshot.ref);
                    try {
                        await addDoc(collection(db, "perfumes"), {
                            nombre: document.getElementById("p-nombre").value,
                            precio: Number(document.getElementById("p-precio").value),
                            descripcion: document.getElementById("p-desc").value,
                            video: document.getElementById("p-video").value,
                            imagen: url,
                            categoria: document.getElementById("p-cat").value,
                            subcategoria: document.getElementById("p-subcat").value,
                            fecha: new Date()
                        });
                        alert("✅ ¡Perfume guardado en el catálogo!");
                        document.getElementById("form-perfume").reset();
                    } catch(e) { alert("Error en base de datos: " + e.message); }
                    btn.innerText = "Guardar en Catálogo"; btn.disabled = false;
                }
            );
        };

        // CARGAR PEDIDOS
        async function cargarPedidos() {
            const div = document.getElementById("lista-pedidos");
            div.innerHTML = "Cargando...";
            const q = query(collection(db, "pedidos"), orderBy("fecha", "desc"));
            const snap = await getDocs(q);
            div.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                const badgeClass = (p.estado || "pendiente").toLowerCase().replace(/ /g, "-");
                div.innerHTML += `
                    <div class="item-lista">
                        <strong>${p.clienteNombre}</strong> <span class="badge ${badgeClass}">${p.estado}</span><br>
                        <small>Total: ₡${p.total} | Tel: ${p.clienteTel}</small>
                        <select onchange="cambiarEstado('${d.id}', this.value)">
                            <option value="">Cambiar estado...</option>
                            <option value="Pendiente">Pendiente</option>
                            <option value="En curso">En curso</option>
                            <option value="Entregado">Entregado</option>
                        </select>
                    </div>`;
            });
        }

        window.cambiarEstado = async (id, estado) => {
            if(!estado) return;
            await updateDoc(doc(db, "pedidos", id), { estado });
            cargarPedidos();
        };

        // CARGAR CLIENTES
        async function cargarClientes() {
            const div = document.getElementById("lista-clientes");
            div.innerHTML = "Cargando...";
            const snap = await getDocs(collection(db, "clientes"));
            div.innerHTML = "";
            snap.forEach(d => {
                const c = d.data();
                div.innerHTML += `
                    <div class="item-lista">
                        <strong>${c.nombre}</strong><br>
                        <small>📞 ${c.telefono} | Saldo: ₡${c.saldo || 0}</small>
                    </div>`;
            });
        }

        // REGISTRAR ABONO
        window.registrarAbono = async () => {
            const tel = document.getElementById("a-tel").value;
            const monto = document.getElementById("a-monto").value;
            if(!tel || !monto) return alert("Faltan datos");
            await addDoc(collection(db, "abonos"), { tel, monto: Number(monto), fecha: new Date() });
            alert("Abono registrado con éxito");
            document.getElementById("a-tel").value = "";
            document.getElementById("a-monto").value = "";
        };
    </script>
</body>
</html>
